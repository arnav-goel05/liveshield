plugins {
    id 'com.android.application' version '9.3.0' apply false
    id 'com.android.library' version '9.3.0' apply false
    id 'com.android.test' version '9.3.0' apply false
}

ext {
    versions = [
        cameraX          : '1.6.1',
        androidXActivity : '1.13.0',
        androidXFragment : '1.8.9',
        openCv           : '4.13.0',
        androidXTest     : '1.7.0',
        androidXTestJunit: '1.3.0',
        espresso         : '3.7.0',
        testOrchestrator : '1.6.1',
        junit            : '4.13.2',
        libphonenumber   : '9.0.36',
        zxing            : '3.5.4',
        rootEncoder      : '2.8.0',
        benchmark        : '1.4.1',
        concurrentFutures: '1.3.0',
        desugarJdkLibs   : '2.1.5',
        checkstyle       : '10.21.4'
    ]

    sdk = [
        compile: providers.gradleProperty('liveshield.compileSdk').get().toInteger(),
        target : providers.gradleProperty('liveshield.targetSdk').get().toInteger(),
        min    : providers.gradleProperty('liveshield.minSdk').get().toInteger()
    ]
    javaLanguageVersion = providers.gradleProperty('liveshield.javaVersion').get().toInteger()
}

ext.configureAndroidQuality = { Project project ->
    project.android {
        lint {
            abortOnError = true
            warningsAsErrors = true
            checkDependencies = true
            checkTestSources = true
            htmlReport = true
            xmlReport = true
            // Versions are deliberately pinned and reviewed in docs/DEPENDENCIES.md.
            // Online "newer version" checks would make a previously green build non-reproducible.
            disable 'AndroidGradlePluginVersion', 'GradleDependency', 'NewerVersionAvailable'
        }
        testOptions {
            unitTests {
                includeAndroidResources = true
                returnDefaultValues = false
            }
            execution = 'ANDROIDX_TEST_ORCHESTRATOR'
            resultsDir = project.rootProject.layout.buildDirectory.dir("android-test-results/${project.name}").get().asFile
            reportDir = project.rootProject.layout.buildDirectory.dir("reports/android-tests/${project.name}").get().asFile
        }
    }

    project.tasks.register('checkstyleAndroid', Checkstyle) {
        group = 'verification'
        description = 'Runs Checkstyle against Android production and test Java sources.'
        source project.fileTree('src') {
            include '**/*.java'
            exclude '**/build/**', '**/generated/**'
        }
        classpath = project.files()
    }

    project.tasks.named('check').configure {
        dependsOn project.tasks.named('checkstyleAndroid')
    }
}

subprojects {
    apply plugin: 'checkstyle'

    checkstyle {
        toolVersion = rootProject.ext.versions.checkstyle
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
        maxErrors = 0
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.withType(Test).configureEach {
        useJUnit()
        failFast = false
        reports {
            junitXml.required = true
            html.required = true
        }
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat = 'full'
        }
    }

    plugins.withId('com.android.application') {
        rootProject.ext.configureAndroidQuality(project)
    }
    plugins.withId('com.android.library') {
        rootProject.ext.configureAndroidQuality(project)
    }
    plugins.withId('com.android.test') {
        rootProject.ext.configureAndroidQuality(project)
    }
}

tasks.register('checkstyleAll') {
    group = 'verification'
    description = 'Runs every module Checkstyle task.'
    dependsOn subprojects.collect { child ->
        child.tasks.matching { it.name == 'checkstyleMain' || it.name == 'checkstyleTest' || it.name == 'checkstyleAndroid' }
    }
}

tasks.register('checkPrivacyBoundaries', Exec) {
    group = 'verification'
    description = 'Checks first-party transport, telemetry, manifest, and audio privacy boundaries.'
    workingDir rootDir
    commandLine 'bash', 'tools/privacy/check-boundaries.sh'
}

subprojects {
    tasks.matching { it.name == 'check' }.configureEach {
        dependsOn rootProject.tasks.named('checkPrivacyBoundaries')
    }
}
