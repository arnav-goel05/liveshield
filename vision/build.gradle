plugins {
    id 'com.android.library'
}

android {
    namespace = 'com.liveshield.vision'
    compileSdk = rootProject.ext.sdk.compile

    defaultConfig {
        minSdk = rootProject.ext.sdk.min
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            // The audited Paddle Lite 2.11 detector runtime is ARM64-only in this app.
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaLanguageVersion)
        targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaLanguageVersion)
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:${rootProject.ext.versions.desugarJdkLibs}"
    implementation project(':privacy-domain')
    implementation files('libs/paddle-lite-2.11/PaddlePredictor.jar')
    api "androidx.concurrent:concurrent-futures:${rootProject.ext.versions.concurrentFutures}"
    implementation "androidx.camera:camera-core:${rootProject.ext.versions.cameraX}"
    implementation "org.opencv:opencv:${rootProject.ext.versions.openCv}"
    implementation "com.googlecode.libphonenumber:libphonenumber:${rootProject.ext.versions.libphonenumber}"
    implementation "com.google.zxing:core:${rootProject.ext.versions.zxing}"

    testImplementation "junit:junit:${rootProject.ext.versions.junit}"
    androidTestImplementation "androidx.test:core:${rootProject.ext.versions.androidXTest}"
    androidTestImplementation "androidx.test:runner:${rootProject.ext.versions.androidXTest}"
    androidTestImplementation "androidx.test.ext:junit:${rootProject.ext.versions.androidXTestJunit}"
    androidTestUtil "androidx.test:orchestrator:${rootProject.ext.versions.testOrchestrator}"
}

tasks.register('verifyApi23VisionAsyncContract') {
    group = 'verification'
    description = 'Rejects Android API 24 CompletableFuture/CompletionStage from production vision code.'
    inputs.files(fileTree('src/main/java') { include '**/*.java' })
    doLast {
        inputs.files.each { sourceFile ->
            String source = sourceFile.getText('UTF-8')
            if (source.contains('CompletionStage') || source.contains('CompletableFuture')) {
                throw new GradleException("API 23 incompatible async type in ${sourceFile}")
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyApi23VisionAsyncContract')
}

tasks.register('verifyYuNetModel') {
    group = 'verification'
    description = 'Verifies the pinned offline YuNet model size and SHA-256 provenance.'
    File model = file('src/main/assets/models/face_detection_yunet_2023mar.onnx')
    inputs.file(model)
    doLast {
        if (model.length() != 232589L) {
            throw new GradleException("Unexpected YuNet model size: ${model.length()}")
        }
        String digest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(model.bytes).encodeHex().toString()
        if (digest != '8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4') {
            throw new GradleException("Unexpected YuNet model SHA-256: ${digest}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyYuNetModel')
}

tasks.register('verifyOfflineVisionDependencies') {
    group = 'verification'
    description = 'Rejects vision SDKs with known automatic metrics or model-download paths.'
    doLast {
        Set<String> forbiddenGroups = [
            'com.google.mlkit',
            'com.google.android.datatransport',
            'com.google.firebase',
            'com.google.mediapipe'
        ] as Set
        Set<String> forbiddenModules = []
        configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents.each {
            component ->
                String group = component.moduleVersion?.group
                if (group != null && (forbiddenGroups.contains(group)
                        || (group.startsWith('com.google.android.gms')
                        && component.moduleVersion.name.contains('mlkit')))) {
                    forbiddenModules.add(component.moduleVersion.toString())
                }
        }
        if (!forbiddenModules.isEmpty()) {
            throw new GradleException(
                "Vision release graph contains forbidden egress dependencies: ${forbiddenModules}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyOfflineVisionDependencies')
}

tasks.register('verifyPaddleOcrArtifacts') {
    group = 'verification'
    description = 'Verifies the frozen operational PP-OCRv3 detector and recognizer artifacts.'
    Map<File, Map<String, Object>> artifacts = [
        (file('libs/paddle-lite-2.11/PaddlePredictor.jar')): [
            size: 9173L,
            sha256: '9b43bf6d07d4cccff14932fe4aee3d3cc2fb3ccae2edbbc28bb6326e4809223b'],
        (file('src/main/jniLibs/arm64-v8a/libpaddle_lite_jni.so')): [
            size: 3176664L,
            sha256: '43ad4f58221570575e58d6af77653f476f7af485ee970ea924f20c0579cc2e01'],
        (file('src/main/assets/models/paddleocr/en_PP-OCRv3_det_slim_infer.nb')): [
            size: 925070L,
            sha256: '9d3c629313d47d203385216a756610eb00ee2496a06ff724cc34904deda70f22'],
        (file('src/main/assets/models/paddleocr/en_PP-OCRv3_rec_slim_infer.nb')): [
            size: 3313574L,
            sha256: '053b3a99fc88233c5ea5fda10141cf2f9c81e93ca2b74ce3dcf8208d3e80185d'],
        (file('src/main/assets/models/paddleocr/en_dict.txt')): [
            size: 190L,
            sha256: '5662df9d2d03f0e8ca0d3b0649d6acbab904b6a14b3d3521463c71c37c668ce3'],
        (file('src/main/assets/models/paddleocr/licenses/Paddle-Lite-LICENSE.txt')): [
            size: 11438L,
            sha256: 'ff6311c56c1b22c9209c96cc8afc16da91c24ee55a15e14ebc46fe1960dbd856'],
        (file('src/main/assets/models/paddleocr/licenses/PaddleOCR-LICENSE.txt')): [
            size: 11376L,
            sha256: '3840c5c0c61c294264d2dd77b8777be6ddd90121ef4e0e64abcd22edea581d6e']
    ]
    File provenanceFile = file('libs/paddle-lite-2.11/PROVENANCE.properties')
    inputs.files(artifacts.keySet() + provenanceFile)
    doLast {
        artifacts.each { artifact, expected ->
            if (artifact.length() != expected.size) {
                throw new GradleException("Unexpected Paddle artifact size: ${artifact}")
            }
            String digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(artifact.bytes).encodeHex().toString()
            if (digest != expected.sha256) {
                throw new GradleException("Unexpected Paddle artifact digest: ${artifact}")
            }
        }
        Map<File, String> optimizerVersions = [
            (file('src/main/assets/models/paddleocr/en_PP-OCRv3_det_slim_infer.nb')): 'v2.10',
            (file('src/main/assets/models/paddleocr/en_PP-OCRv3_rec_slim_infer.nb')): 'v2.11-rc']
        optimizerVersions.each { model, expectedVersion ->
            byte[] header = model.bytes
            int metaVersion = (header[0] & 0xff) | ((header[1] & 0xff) << 8)
            int versionLength = 0
            while (versionLength < 16 && header[2 + versionLength] != 0) {
                versionLength++
            }
            String optimizerVersion = new String(
                header, 2, versionLength, java.nio.charset.StandardCharsets.US_ASCII)
            if (metaVersion != 2 || optimizerVersion != expectedVersion) {
                throw new GradleException(
                    "Unexpected Paddle model header: ${model}, meta=${metaVersion}, "
                        + "optimizer=${optimizerVersion}")
            }
        }
        String runtime = new String(
            file('src/main/jniLibs/arm64-v8a/libpaddle_lite_jni.so').bytes,
            java.nio.charset.StandardCharsets.ISO_8859_1)
        if (!runtime.contains('v2.11')) {
            throw new GradleException('Paddle JNI does not identify as audited v2.11 runtime')
        }
        Properties provenance = new Properties()
        provenanceFile.withInputStream { provenance.load(it) }
        Map<String, String> expectedProvenance = [
            'runtime.version': 'v2.11',
            'archive.url': 'https://github.com/PaddlePaddle/Paddle-Lite/releases/download/'
                + 'v2.11/inference_lite_lib.android.armv8.gcc.c%2B%2B_shared.with_extra.with_cv.tar.gz',
            'archive.size': '9791354',
            'archive.sha256': 'b8165795964594adf7ded116f3955dfd4dfe5964c4559fd22e8d2aa6f73a674e',
            'jar.path': 'java/PaddlePredictor.jar',
            'jar.size': '9173',
            'jar.sha256': '9b43bf6d07d4cccff14932fe4aee3d3cc2fb3ccae2edbbc28bb6326e4809223b',
            'jni.path': 'cxx/lib/arm64-v8a/libpaddle_lite_jni.so',
            'jni.size': '3176664',
            'jni.sha256': '43ad4f58221570575e58d6af77653f476f7af485ee970ea924f20c0579cc2e01',
            'license': 'Apache-2.0',
            'license.sha256': 'ff6311c56c1b22c9209c96cc8afc16da91c24ee55a15e14ebc46fe1960dbd856'
        ]
        if (provenance.size() != expectedProvenance.size()
                || !expectedProvenance.every { key, value -> provenance.getProperty(key) == value }) {
            throw new GradleException('Paddle runtime provenance manifest does not match audit')
        }
        String dictionary = file('src/main/assets/models/paddleocr/en_dict.txt').getText('UTF-8')
        List<String> dictionaryLines = dictionary.readLines()
        if (dictionaryLines.size() != 95 || dictionaryLines.last() != ' '
                || !'@._+-/:()'.every { dictionaryLines.contains(it.toString()) }) {
            throw new GradleException('PP-OCRv3 dictionary contract does not match audit')
        }
        List<File> forbiddenCandidates = [
            file('src/main/assets/models/opencv-crnn'),
            file('src/main/assets/models/paddleocr/PP-OCRv5_mobile_rec.nb'),
            file('src/main/assets/models/paddleocr/ppocr_keys_ocrv5.txt'),
            file('libs/paddle-lite-2.14-rc')]
        List<File> presentCandidates = forbiddenCandidates.findAll { it.exists() }
        if (!presentCandidates.isEmpty()) {
            throw new GradleException("Experimental OCR candidate remains packaged: ${presentCandidates}")
        }
    }
}

tasks.register('verifyOfflineOcrReleaseBoundary') {
    group = 'verification'
    description = 'Rejects OCR runtime egress APIs, downloader code, and manifest permissions.'
    inputs.files(fileTree('src/main/java/com/liveshield/vision/pii') { include '**/*.java' })
    doLast {
        List<String> forbidden = [
            'java.net.', 'android.net.', 'okhttp', 'retrofit', 'DownloadManager',
            'HttpURLConnection', 'Socket', 'Telemetry', 'Log.', 'System.out', 'System.err'
        ]
        inputs.files.each { sourceFile ->
            String source = sourceFile.getText('UTF-8')
            String match = forbidden.find { source.contains(it) }
            if (match != null) {
                throw new GradleException("Offline OCR boundary contains ${match}: ${sourceFile}")
            }
        }
        File manifest = file('src/main/AndroidManifest.xml')
        if (manifest.exists()) {
            String text = manifest.getText('UTF-8')
            if (text.contains('android.permission.INTERNET')
                    || text.contains('android.permission.ACCESS_NETWORK_STATE')) {
                throw new GradleException('Vision manifest declares a network permission')
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyPaddleOcrArtifacts')
    dependsOn tasks.named('verifyOfflineOcrReleaseBoundary')
}

tasks.register('verifyOfflineBarcodeDependency') {
    group = 'verification'
    description = 'Pins the release barcode runtime to the reviewed offline ZXing core artifact.'
    doLast {
        Set<String> zxingModules = [] as Set
        configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents.each {
            component ->
                if (component.moduleVersion?.group == 'com.google.zxing') {
                    zxingModules.add(component.moduleVersion.toString())
                }
        }
        Set<String> expected = ["com.google.zxing:core:${rootProject.ext.versions.zxing}"] as Set
        if (zxingModules != expected) {
            throw new GradleException(
                "Unexpected ZXing release dependency graph: ${zxingModules}; expected ${expected}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyOfflineBarcodeDependency')
}
